<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.box {
    width: 210px;
    padding: 9px 11px;
    border-radius: 10px;
    background: rgba(10, 15, 25, 0.96);
    color: white;
    border: 1px solid rgba(255,255,255,0.08);
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
}

.name {
    font-size: 12px;
    font-weight: 700;
}

.status {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 8px;
    color: #22c55e;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
}

.offline {
    background: #ef4444;
}

.info {
    display: flex;
    gap: 5px;
}

.item {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 5px 7px;
}

.label {
    color: #64748b;
    font-size: 7px;
    text-transform: uppercase;
}

.value {
    font-size: 13px;
    font-weight: 700;
    margin-top: 1px;
}

#queue {
    color: #fbbf24;
}
</style>
</head>

<body>

<div class="box">

    <div class="top">
        <div class="name">ER:LC</div>

        <div class="status">
            <span id="dot" class="dot"></span>
            <span id="status">ONLINE</span>
        </div>
    </div>

    <div class="info">

        <div class="item">
            <div class="label">Players</div>
            <div class="value" id="players">--/--</div>
        </div>

        <div class="item">
            <div class="label">Queue</div>
            <div class="value" id="queue">--</div>
        </div>

    </div>

</div>

<script>

async function updateServer() {

    try {

        const response = await fetch("/api/players", {
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "API error");
        }

        document.getElementById("players").textContent =
            `${data.players}/${data.maxPlayers}`;

        document.getElementById("queue").textContent =
            data.queue;

        document.getElementById("status").textContent =
            "ONLINE";

        document.getElementById("dot").classList.remove("offline");

    } catch (error) {

        document.getElementById("players").textContent =
            "--/--";

        document.getElementById("queue").textContent =
            "--";

        document.getElementById("status").textContent =
            "OFFLINE";

        document.getElementById("dot").classList.add("offline");
    }
}

updateServer();

setInterval(updateServer, 2000);

</script>

</body>
</html>
