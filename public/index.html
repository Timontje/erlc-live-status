<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
}

.box {
    width: 800px;
    height: 270px;
    padding: 32px;
    border-radius: 28px;
    background: rgba(10, 15, 25, 0.97);
    color: white;
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 15px 50px rgba(0,0,0,0.45);
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.name {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    color: #22c55e;
}

.dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 15px #22c55e;
}

.dot.offline {
    background: #ef4444;
    box-shadow: 0 0 15px #ef4444;
}

.info {
    display: flex;
    gap: 18px;
}

.item {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 22px 25px;
}

.label {
    color: #64748b;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.value {
    font-size: 36px;
    font-weight: 800;
    margin-top: 5px;
}

#queue {
    color: #fbbf24;
}
</style>
</head>

<body>

<div class="box">

    <div class="top">

        <div class="name">
            ER:LC
        </div>

        <div class="status">
            <span id="dot" class="dot"></span>
            <span id="status">ONLINE</span>
        </div>

    </div>

    <div class="info">

        <div class="item">
            <div class="label">
                Players
            </div>

            <div class="value" id="players">
                --/--
            </div>
        </div>

        <div class="item">
            <div class="label">
                Queue
            </div>

            <div class="value" id="queue">
                --
            </div>
        </div>

    </div>

</div>

<script>

async function updateServer() {

    try {

        const response = await fetch("/api/players", {
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "API error");
        }

        document.getElementById("players").textContent =
            `${data.players}/${data.maxPlayers}`;

        document.getElementById("queue").textContent =
            data.queue;

        document.getElementById("status").textContent =
            "ONLINE";

        document.getElementById("dot").classList.remove("offline");

    } catch (error) {

        console.error(error);

        document.getElementById("players").textContent =
            "--/--";

        document.getElementById("queue").textContent =
            "--";

        document.getElementById("status").textContent =
            "OFFLINE";

        document.getElementById("dot").classList.add("offline");
    }
}

updateServer();

setInterval(updateServer, 2000);

</script>

</body>
</html>
